name: CI

# Pull requests are the gate: a squash merge of a green PR adds nothing to
# test on main. Prose-only changes do not compile anything.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.png"
      - "**.jpg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEXINPUTS: "./tikz-flora/tex//:"
    steps:
      - uses: actions/checkout@v4
      - id: engine
        run: echo "ref=$(cat engine-ref.txt)" >> "$GITHUB_OUTPUT"
      # The engine's own tests run in krissen/tikz-flora; here it is only
      # a pinned dependency.
      - uses: actions/checkout@v4
        with:
          repository: krissen/tikz-flora
          ref: ${{ steps.engine.outputs.ref }}
          path: tikz-flora
      # One job compiles all test documents, so the TeX Live image is
      # pulled once per run.
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            test/smoke.tex
            test/stock.tex
            test/titles.tex
            test/title-defaults.tex
            test/render-dispatch.tex
            test/growth.tex
            test/growth-timed.tex
            test/growth-poster.tex
            test/growth-handout.tex
            test/frame-settings.tex
            test/frametitle-wrap.tex
            test/headline.tex
            test/ornament-settings.tex
            test/visual/ornament-catalogue.tex
            test/margins.tex
            test/article-mode.tex
            test/overlay-reuse.tex
            docs/src/tour.tex
            docs/src/showcase.tex
            docs/src/stock-default.tex
            docs/src/stock-Madrid.tex
            docs/src/stock-Berlin.tex
            test/acceptance/matrix-43.tex
            test/acceptance/matrix-169.tex
            test/acceptance/coverage.tex
            test/acceptance/reserve-background.tex
            test/acceptance/overlays.tex
            test/acceptance/handout.tex
          latexmk_use_lualatex: true
          extra_system_packages: python3 py3-pillow nodejs qpdf poppler-utils
          pre_compile: |
            set -e
            # latex-action forwards TEXINPUTS but not FLORA_LUA; the engine's
            # boot searches ./lua, so expose the fork's modules there.
            ln -sfn tikz-flora/lua lua
            texlua test/overlays.lua tikz-flora
            texlua test/growth.lua tikz-flora
            texlua test/raster-cache.lua tikz-flora
            texlua test/raster-worker.lua tikz-flora
            python3 test/raster-publication.py
            python3 test/gif-job.py
            python3 test/measure-raster-build.py
            python3 test/engine-pin.py
            texlua test/pdf-startup.lua
          post_compile: |
            set -e
            FLORAL_VERIFY_STABLE=1 latexmk -g -lualatex -interaction=nonstopmode -halt-on-error test/growth.tex
            texlua test/check_boxes.lua frametitle-wrap.log
            texlua test/check_boxes.lua headline.log
            texlua test/check_boxes.lua ornament-settings.log
            texlua test/check_boxes.lua ornament-catalogue.log
            FLORAL_VERIFY_STABLE=1 latexmk -g -lualatex -interaction=nonstopmode -halt-on-error test/acceptance/overlays.tex
            FLORAL_VERIFY_STABLE=1 latexmk -g -lualatex -interaction=nonstopmode -halt-on-error test/frame-settings.tex
            # Keep these checks in the TeX container: it owns the generated
            # PDFs and provides the matching LuaLaTeX/latexmk installation.
            python3 tools/check_growth_pdf.py growth-timed.pdf
            python3 tools/build_animation.py --engine tikz-flora --outdir build/raster test/growth-raster.tex
            python3 tools/check_growth_pdf.py build/raster/growth-raster.pdf
            python3 tools/build_animation.py --engine tikz-flora --outdir build/raster-geometry test/raster-geometry.tex
            FLORAL_VERIFY_STABLE=1 python3 tools/build_animation.py --engine tikz-flora --outdir build/raster-geometry test/raster-geometry.tex
            python3 tools/check_growth_pdf.py build/raster-geometry/raster-geometry.pdf
            python3 tools/build_animation.py --engine tikz-flora --outdir build/gif test/growth-gif.tex
            python3 tools/check_gif_pdf.py build/gif/growth-gif.pdf --pages 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: latex-diagnostics
          path: |
            **/*.log
            **/*.pdf
