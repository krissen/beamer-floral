name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root_file: [test/smoke.tex, test/stock.tex]
    env:
      TEXINPUTS: "./tikz-flora/tex//:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: krissen/tikz-flora
          ref: b25c15ca0197e26724048e1eb77f93c9145e381a
          path: tikz-flora
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.root_file }}
          latexmk_use_lualatex: true
          pre_compile: |
            set -e
            # latex-action forwards TEXINPUTS but not FLORA_LUA; the engine's
            # boot searches ./lua, so expose the fork's modules there.
            ln -sfn tikz-flora/lua lua
            (cd tikz-flora && texlua tests/test_layout.lua)
