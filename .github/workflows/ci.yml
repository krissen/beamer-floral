name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEXINPUTS: "./tikz-flora/tex//:"
      FLORA_LUA: "./tikz-flora/lua"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: krissen/tikz-flora
          ref: beamer-floral
          path: tikz-flora
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: test/smoke.tex
          latexmk_use_lualatex: true
          pre_compile: |
            set -e
            ln -sfn tikz-flora/lua lua
            (cd tikz-flora && texlua tests/test_layout.lua)
