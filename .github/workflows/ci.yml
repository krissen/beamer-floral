name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: krissen/tikz-flora
          ref: beamer-floral
          path: tikz-flora
      - uses: xu-cheng/texlive-action/full@v2
        with:
          run: |
            set -e
            export TIKZFLORA="$GITHUB_WORKSPACE/tikz-flora"
            latexmk -lualatex -interaction=nonstopmode -halt-on-error -outdir=build test/smoke.tex
            (cd tikz-flora && texlua tests/test_layout.lua)
